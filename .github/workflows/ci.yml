name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run coverage

      - name: Upload coverage reports
        if: matrix.node-version == '20'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Check build output
        run: |
          find dist -maxdepth 3 -type f -print
          for file in \
            dist/index.cjs \
            dist/index.mjs \
            dist/index.d.ts \
            dist/index.d.cts \
            dist/worker/index.cjs \
            dist/worker/index.mjs; do
            if [ ! -f "$file" ]; then
              echo "Build output missing required file: $file"
              exit 1
            fi
          done

      - name: Check published types
        run: pnpm run test:types

      - name: Pack package
        run: |
          mkdir -p package-artifact
          pnpm pack --pack-destination package-artifact

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package-artifact/*.tgz
          retention-days: 7

  vite-compatibility:
    name: Vite ${{ matrix.vite-version }} Compatibility
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        vite-version: ['4.5.14', '5.4.21', '6.4.1', '7.2.2', '8.2.1']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/plugin-package

      - name: Install compatibility fixture
        working-directory: test-fixtures/vite
        env:
          VITE_VERSION: ${{ matrix.vite-version }}
        run: |
          package_tarball=$(find "${RUNNER_TEMP}/plugin-package" -name '*.tgz' -print -quit)
          test -n "$package_tarball"
          pnpm add --save-dev "vite@${VITE_VERSION}" "$package_tarball"

      - name: Build compatibility fixture
        working-directory: test-fixtures/vite
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee "${RUNNER_TEMP}/vite-build.log"
          if grep -F 'overwrites a previously emitted file of the same name' "${RUNNER_TEMP}/vite-build.log"; then
            echo "Unexpected conflicting build assets"
            exit 1
          fi

      - name: Verify obfuscated output
        working-directory: test-fixtures/vite
        run: |
          for module_format in esm cjs; do
            assets_dir="dist/${module_format}/assets"
            test -f "dist/${module_format}/index.html"
            test -n "$(find "$assets_dir" -name '*.js' -print -quit)"

            worker_file=$(find "$assets_dir" -name 'worker-*.js' -print -quit)
            if [ -z "$worker_file" ] || [ ! -f "${worker_file}.map" ]; then
              echo "Expected ${module_format} worker and worker sourcemap output"
              exit 1
            fi

            while IFS= read -r map_file; do
              node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$map_file"
            done < <(find "$assets_dir" -name '*.map' -type f)

            if grep -R "OBFUSCATOR_COMPATIBILITY_SENTINEL" "$assets_dir" --include='*.js'; then
              echo "Expected ${module_format} JavaScript output to be obfuscated"
              exit 1
            fi
          done
